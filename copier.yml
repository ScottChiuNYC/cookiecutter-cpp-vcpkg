_min_copier_version: "9.19.1"
_subdirectory: template

project_name:
  type: str
  default: "my_project"
project_slug:
  type: str
  default: "{{ project_name.lower().replace(' ', '_').replace('-', '_') }}"
  validator: >-
    {% if not (project_slug | regex_search("^[a-z_][a-z0-9_]*$")) %}Use a valid identifier.{% endif %}
project_description:
  type: str
  default: "A vcpkg C++ library"
version:
  type: str
  default: "0.1.0"
  validator: >-
    {% if not (version | regex_search("^[0-9]+(\\.[0-9]+){2}$")) %}Use a numeric CMake version (major.minor.patch).{% endif %}
vcpkg_port_name:
  type: str
  default: "{{ project_slug.replace('_', '-').strip('-') }}"
  validator: >-
    {% if not (vcpkg_port_name | regex_search("^[a-z0-9]+(-[a-z0-9]+)*$")) or vcpkg_port_name == 'gtest' or vcpkg_port_name.startswith('vcpkg-') %}Use a lowercase vcpkg name with hyphens; gtest and vcpkg-* are reserved.{% endif %}
author_name:
  type: str
  default: "Your Name"
author_email:
  type: str
  default: "your.email@example.com"
cpp_standard:
  type: str
  default: "17"
cmake_min_version:
  type: str
  default: "3.25"
